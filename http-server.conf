server {
    listen 80 default_server;

    # never serve files from the container: unmatched requests return 404
    root /var/empty;

    include /etc/nginx/routes.conf;

    expires -1;
    add_header Pragma "no-cache";
    add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # CORS is left to the backends. To handle it here, allow explicit origins only, e.g.:
    # add_header Access-Control-Allow-Origin "https://app.example.com" always;
    # add_header Access-Control-Allow-Methods "GET, POST, DELETE, PUT, PATCH, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;
    # Never combine Access-Control-Allow-Credentials "true" with a wildcard or reflected origin.

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    default_type application/json;
}
